name: Build & Tests
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set Node.js 24.x
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: 'npm'
      - run: |
          npm install
      - run: |
          npm run all
  job1:
    name: Job 1
    needs: build
    runs-on: ubuntu-latest
    outputs:
      out1: ${{ steps.s1.outputs.out1 }}
    steps:
      - id: s1
        run: echo "out1=test-1" >> $GITHUB_OUTPUT
  job2:
    name: Job 2
    needs: build
    runs-on: ubuntu-latest
    outputs:
      out2: ${{ steps.s2.outputs.out2 }}
    steps:
      - run: sleep 60
      - id: s2
        run: echo "out2=test-2" >> $GITHUB_OUTPUT
      - run: |
          echo '{"out2":"test-2"}' > output2.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: output2.json
          path: output2.json
          retention-days: 1
  test:
    name: Test
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Some step that can run without job 2:: $JOB1_OUT1"
        env:
          JOB1_OUT1: ${{ needs.job1.outputs.out1 }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: wait-for-jobs
        uses: ./
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          jobs: Job 2
          outputs-from: output2.json
      - run: |
          echo "Some step that needs job 2:: $WAIT_OUT2"
        env:
          WAIT_OUT2: ${{ fromJSON(steps.wait-for-jobs.outputs.outputs).out2 }}
