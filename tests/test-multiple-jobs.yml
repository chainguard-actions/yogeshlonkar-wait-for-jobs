name: Test multiple jobs input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run wait-for-jobs with multiple comma-separated job names
        id: action
        uses: .
        continue-on-error: true
        with:
          gh-token: ${{ github.token }}
          jobs: 'job-one, job-two, job-three'
          ttl: '1'
          interval: '500'

      - name: Assert action failed gracefully (timeout or jobs not found)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (timeout or jobs not found), got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when multiple jobs were not found within TTL"
