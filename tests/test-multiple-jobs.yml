name: Test waiting for multiple jobs (timeout expected under act)
on:
  workflow_dispatch:
jobs:
  test:
    name: Test Multiple Jobs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: wait
        name: Wait for multiple non-existent jobs (will timeout under act)
        uses: .
        with:
          gh-token: ${{ github.token }}
          jobs: "Dependency One,Dependency Two"
          interval: "500"
          ttl: "1"
        continue-on-error: true

      - name: Assert action failed due to timeout or jobs not found
        env:
          OUTCOME: ${{ steps.wait.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (jobs not found in API under act) but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when multiple jobs were not found within TTL"
