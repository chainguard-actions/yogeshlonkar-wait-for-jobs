name: Test basic usage - wait for jobs

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake GitHub run context
        run: |
          echo "GITHUB_RUN_ID=${GITHUB_RUN_ID:-1}" >> $GITHUB_ENV
          echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY:-test/repo}" >> $GITHUB_ENV

      - id: action
        uses: .
        continue-on-error: true
        with:
          gh-token: ${{ github.token }}
          jobs: "nonexistent-job"
          interval: "1000"
          ttl: "1"

      - name: Assert action ran (may fail due to API unavailability in act)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed with outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
