name: Test basic usage - wait for job

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          gh-token: ${{ github.token }}
          jobs: some-job
          ttl: '1'
          interval: '1000'

      - name: Assert action ran and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action polls GitHub API for jobs in this run.
          # Under the harness, GITHUB_REPOSITORY is a sentinel that doesn't exist,
          # so the API call will 404 or the job won't be found, causing a timeout/failure.
          # We accept either success (unlikely) or failure (expected with sentinel repo).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' (graceful)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
