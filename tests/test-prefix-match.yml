name: Test prefix matching

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with prefix=true (expect timeout since no matching job found)
        id: wait
        uses: .
        continue-on-error: true
        with:
          gh-token: ${{ github.token }}
          jobs: build-
          prefix: 'true'
          interval: '1000'
          ttl: '1'

      - name: Assert action failed (timeout expected since no prefix-matched job found)
        env:
          OUTCOME: ${{ steps.wait.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With prefix=true, the action looks for jobs whose names start with "build-".
          # Under act, the GitHub API won't have jobs for this local run, so it times out.
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail (timeout), but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed with prefix=true (outcome=$OUTCOME)"
