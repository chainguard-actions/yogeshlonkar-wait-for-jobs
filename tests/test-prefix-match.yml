name: Test prefix matching option

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          gh-token: ${{ github.token }}
          jobs: build-
          prefix: 'true'
          ttl: '1'
          interval: '1000'

      - name: Assert action ran and failed gracefully with prefix matching
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With prefix=true, the action matches jobs whose names start with the given prefix.
          # Under the harness, GITHUB_REPOSITORY is a sentinel so the API call
          # will fail or no matching jobs will be found, causing a timeout/failure.
          # We accept either success or failure as graceful completion.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' (graceful with prefix matching)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
