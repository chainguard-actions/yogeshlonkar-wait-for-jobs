name: Test outputs-from input

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          gh-token: ${{ github.token }}
          jobs: some-job
          outputs-from: some-artifact-job
          ttl: '1'
          interval: '1000'

      - name: Assert action ran with outputs-from input
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action may fail because there is no real GitHub API in act,
          # but we verify it was invoked (outcome is set, not empty).
          if [ -z "${{ steps.action.outcome }}" ]; then
            echo "FAIL: action did not run at all"
            exit 1
          fi
          echo "PASS: action ran with outputs-from input, outcome=${{ steps.action.outcome }}"
