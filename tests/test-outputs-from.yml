name: Test outputs-from input coverage

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          gh-token: ${{ github.token }}
          jobs: nonexistent-job-for-outputs-from-test
          outputs-from: nonexistent-artifact-job
          ttl: '1'
          interval: '5000'

      - name: Assert action ran with outputs-from input (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (failure expected under act due to nonexistent job/artifact)"
