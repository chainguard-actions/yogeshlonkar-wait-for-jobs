name: Test basic timeout behavior

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action (expect timeout/failure since job won't be found via API)
        id: wait
        uses: .
        continue-on-error: true
        with:
          gh-token: ${{ github.token }}
          jobs: nonexistent-job-that-will-never-be-found
          interval: '1000'
          ttl: '1'

      - name: Assert action failed due to timeout or missing job
        env:
          OUTCOME: ${{ steps.wait.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the job is not found and TTL expires,
          # OR it may warn and keep polling until TTL. Either way, outcome != success.
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail (job not found / timeout), but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed (outcome=$OUTCOME)"
