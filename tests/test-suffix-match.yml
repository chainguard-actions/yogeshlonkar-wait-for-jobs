name: Test suffix match option

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: wait
        uses: .
        continue-on-error: true
        with:
          gh-token: ${{ github.token }}
          jobs: -deploy
          suffix: 'true'
          ttl: '1'
          interval: '5000'

      - name: Assert action failed due to timeout with suffix matching
        env:
          OUTCOME: ${{ steps.wait.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (timeout) but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no jobs with suffix were found within TTL"
