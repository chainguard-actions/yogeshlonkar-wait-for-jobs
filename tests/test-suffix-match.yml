name: Test suffix-based job name matching (timeout expected under act)
on:
  workflow_dispatch:
jobs:
  test:
    name: Test Suffix Match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: wait
        name: Wait for job with suffix matching (will timeout under act)
        uses: .
        with:
          gh-token: ${{ github.token }}
          jobs: "Suffix Job"
          suffix: "true"
          interval: "500"
          ttl: "1"
        continue-on-error: true

      - name: Assert action failed due to timeout or no suffix match found
        env:
          OUTCOME: ${{ steps.wait.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no job with suffix 'Suffix Job' found in API under act) but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no job matched the suffix within TTL"
