name: Test ignore-skipped input

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with ignore-skipped=true (expect timeout since job won't be found)
        id: wait
        uses: .
        continue-on-error: true
        with:
          gh-token: ${{ github.token }}
          jobs: some-skipped-job
          ignore-skipped: 'true'
          interval: '1000'
          ttl: '1'

      - name: Assert action failed (timeout expected since job not found in API)
        env:
          OUTCOME: ${{ steps.wait.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With ignore-skipped=true, skipped jobs are allowed, but the job still
          # won't be found in the API response for this local act run, so it times out.
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail (timeout), but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed with ignore-skipped=true (outcome=$OUTCOME)"
