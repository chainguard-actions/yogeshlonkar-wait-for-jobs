name: Test ignore-skipped option (timeout expected under act)
on:
  workflow_dispatch:
jobs:
  test:
    name: Test Ignore Skipped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: wait
        name: Wait for non-existent job with ignore-skipped enabled (will timeout under act)
        uses: .
        with:
          gh-token: ${{ github.token }}
          jobs: "Skipped Job"
          ignore-skipped: "true"
          interval: "500"
          ttl: "1"
        continue-on-error: true

      - name: Assert action failed due to timeout or job not found
        env:
          OUTCOME: ${{ steps.wait.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (job not found in API under act) but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when job was not found within TTL (ignore-skipped does not prevent timeout for missing jobs)"
