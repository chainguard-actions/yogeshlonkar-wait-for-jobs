name: Test no-max-ttl input

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with no-max-ttl=true and short ttl (expect timeout)
        id: wait
        uses: .
        continue-on-error: true
        with:
          gh-token: ${{ github.token }}
          jobs: some-long-running-job
          no-max-ttl: 'true'
          ttl: '1'
          interval: '1000'

      - name: Assert action failed (timeout expected)
        env:
          OUTCOME: ${{ steps.wait.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With no-max-ttl=true, the ttl won't be capped at 15 minutes.
          # The job won't be found via the API for this local act run, so it times out.
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail (timeout), but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed with no-max-ttl=true (outcome=$OUTCOME)"
