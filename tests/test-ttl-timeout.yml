name: Test TTL timeout for non-existent job
on:
  workflow_dispatch:
jobs:
  test:
    name: Test TTL Timeout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: wait
        name: Wait for non-existent job (should timeout)
        uses: .
        with:
          gh-token: ${{ github.token }}
          jobs: "NonExistentJobThatWillNeverComplete"
          interval: "500"
          ttl: "1"
        continue-on-error: true

      - name: Assert action failed due to timeout
        env:
          OUTCOME: ${{ steps.wait.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with timeout but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when job was not found within TTL"
